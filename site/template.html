<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --fg: #1c1c1e; --muted: #6a6a70; --faint: #9a9aa0;
  --line: #e2e0d8; --grid: rgba(0,0,0,.055); --stripe: rgba(0,0,0,.022); --axis: #fbfaf7;
  --accent: #2b59c3; --accent-soft: rgba(43,89,195,.12); --chip: #efede6; --cursor: rgba(43,89,195,.55);
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.07); --lightness: 44%; --sat: 52%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131417; --surface: #1c1d21; --fg: #ececef; --muted: #a0a0a8; --faint: #6f6f78;
    --line: #2c2d33; --grid: rgba(255,255,255,.06); --stripe: rgba(255,255,255,.02); --axis: #17181b;
    --accent: #7ea2ff; --accent-soft: rgba(126,162,255,.14); --chip: #26272c; --cursor: rgba(126,162,255,.55);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); --lightness: 66%; --sat: 58%;
  }
}
:root[data-theme="dark"] {
  --bg: #131417; --surface: #1c1d21; --fg: #ececef; --muted: #a0a0a8; --faint: #6f6f78;
  --line: #2c2d33; --grid: rgba(255,255,255,.06); --stripe: rgba(255,255,255,.02); --axis: #17181b;
  --accent: #7ea2ff; --accent-soft: rgba(126,162,255,.14); --chip: #26272c; --cursor: rgba(126,162,255,.55);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); --lightness: 66%; --sat: 58%;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 14px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }

header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 6px 0 0; letter-spacing: -.01em; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
header h1 .logo { width: 22px; height: 22px; flex: none; color: var(--fg); }
header h1 span { color: var(--muted); font-weight: 500; }
.eras { display: flex; gap: 4px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 8px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.btn:hover { background: var(--chip); }
.btn kbd { color: var(--faint); font-size: 10.5px; margin-left: 4px; font-family: inherit; }
.spacer { flex: 1; }
.search { position: relative; }
.search input { width: 200px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 7px; padding: 5px 9px; font: inherit; font-size: 13px; }
.search input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.results { position: absolute; right: 0; top: calc(100% + 4px); width: 340px; max-height: 60vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); z-index: 20; display: none; }
.results.open { display: block; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 11px; cursor: pointer; border-bottom: 1px solid var(--line); }
.results button:hover, .results button.hl { background: var(--accent-soft); }
.results .r-when { color: var(--muted); font-size: 11.5px; }
.results .r-head { position: sticky; top: 0; background: var(--surface); padding: 7px 11px 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
.results .r-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

main { flex: 1; display: flex; min-height: 0; }
#stage { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
#overview { height: 78px; width: 100%; display: block; border-bottom: 1px solid var(--line); cursor: pointer; background: var(--axis); }
#canvasWrap { position: relative; flex: 1; min-height: 0; }
#tl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; outline: none; }
#tl.dragging { cursor: grabbing; }
#tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; box-shadow: var(--shadow); font-size: 12.5px; max-width: 300px; display: none; z-index: 5; }
#tip .t-when { color: var(--muted); font-size: 11.5px; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 11.5px; color: var(--muted); background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; pointer-events: none; }
.hint kbd { font-family: inherit; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 10.5px; background: var(--surface); color: var(--fg); }
.zoombox { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 4px; }

aside.closed { display: none; }
.panel-close { position: sticky; top: 0; float: right; z-index: 2; width: 30px; height: 30px; margin: -6px -8px 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
.panel-close:hover { color: var(--fg); background: var(--chip); }
aside { width: 390px; flex: none; border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 18px 20px 40px; }
aside h2 { font-size: 19px; line-height: 1.25; margin: 6px 0 8px; letter-spacing: -.01em; }
aside h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
.globe { margin: 0 0 12px; }
.pic { margin: 10px 0 12px; }
.pic img { display: block; width: 100%; height: auto; max-height: 300px; object-fit: contain; background: var(--chip); border-radius: 8px; }
.pic figcaption { font-size: 12px; line-height: 1.4; color: var(--muted); margin-top: 5px; }
.pic .pic-credit { display: block; color: var(--faint); font-size: 11px; margin-top: 2px; }
.globe canvas { display: block; width: 100%; height: 200px; cursor: grab; touch-action: pan-y; }
.globe canvas:active { cursor: grabbing; }
.globe figcaption { font-size: 11.5px; line-height: 1.4; color: var(--muted); text-align: center; margin-top: 2px; }
.globe .g-note { display: block; color: var(--faint); margin-top: 2px; }
.when { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 2px 10px 2px 7px; font-size: 12.5px; cursor: pointer; margin: 0 4px 4px 0; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.chip:hover { border-color: var(--accent); }
.cites { list-style: none; padding: 0; margin: 0; }
.cites li { margin: 0 0 8px; padding-left: 16px; position: relative; font-size: 13px; }
.cites li::before { content: "↗"; position: absolute; left: 0; color: var(--faint); font-size: 11px; top: 1px; }
.cites .dom { color: var(--faint); font-size: 11.5px; }
.rel { font-size: 12.5px; color: var(--muted); margin: 8px 0 4px; }
.origin { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 10px 0; }
.origin p { margin: 2px 0 8px; }
.orow { margin: 0 0 8px; }
.ohow { display: block; font-size: 11.5px; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.onote { font-size: 12.5px; color: var(--muted); margin-top: -1px; }
.navrow { display: flex; gap: 6px; margin-top: 14px; }
.navrow .btn { flex: 1; }
.btn[disabled] { opacity: .4; cursor: default; }
.near button { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 7px 2px; cursor: pointer; font-size: 13px; }
.near button:hover { background: var(--accent-soft); }
.near .nb { color: var(--muted); font-size: 11.5px; }
.intro p { color: var(--fg); margin: 0 0 10px; }
.intro ul { padding-left: 18px; margin: 0 0 10px; }
.intro li { margin-bottom: 4px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 13px; }
.keys kbd { font-family: inherit; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 11.5px; background: var(--bg); white-space: nowrap; justify-self: start; }
.note { color: var(--muted); font-size: 12.5px; }
p.why { border-left: 3px solid var(--accent); padding: 2px 0 2px 11px; margin: 4px 0 6px; }
.conn button .nb { font-style: italic; }
.cites .kind { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 9px; background: var(--chip); color: var(--muted); margin-left: 4px; vertical-align: 1px; }
.cites .k-primary { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--fg); }
.cites .k-textbook, .cites .k-paper, .cites .k-museum, .cites .k-archive { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--fg); }
.synthetic-note { font-size: 12px; color: var(--muted); background: var(--chip); border-radius: 8px; padding: 6px 9px; margin: 8px 0; }
.single { font-size: 12px; color: var(--muted); margin: -2px 0 8px; }
.single b { font-weight: 600; font-size: 10.5px; padding: 0 6px; border-radius: 9px; background: var(--chip); margin-right: 5px; vertical-align: 1px; }

@media (max-width: 1500px) { header h1 span { display: none; } .btn kbd { display: none; } }
.grip { display: none; }
.g-short { display: none; }
/* ---- phones & small tablets ---- */
@media (max-width: 820px), (max-height: 500px) and (orientation: landscape) {
  header { display: grid; grid-template-columns: auto 1fr auto auto; grid-template-areas: "title search guide theme" "eras eras eras eras"; gap: 7px 8px; padding: 8px 12px 7px; }
  header h1 { grid-area: title; font-size: 15px; margin: 0; }
  .search { grid-area: search; min-width: 0; }
  .search input { width: 100%; min-width: 0; }
  .results { width: min(340px, calc(100vw - 24px)); }
  #guideBtn { grid-area: guide; } #themeBtn { grid-area: theme; }
  .g-long { display: none; } .g-short { display: inline; }
  .btn { padding: 4px 9px; font-size: 12.5px; }
  .spacer { display: none; }
  /* eras: one swipeable row instead of three wrapped ones */
  .eras { grid-area: eras; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 24px), transparent); }
  .eras::-webkit-scrollbar { display: none; }
  .hint { display: none; }
}
/* portrait: details slide up from the bottom as a sheet */
@media (max-width: 820px) and (orientation: portrait), (max-width: 600px) {
  main { flex-direction: column; }
  aside { width: auto; height: 46vh; flex: none; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; margin-top: -10px; position: relative; z-index: 3;
          box-shadow: 0 -8px 24px rgba(0,0,0,.18); padding: 4px 18px 30px; transition: height .22s ease; }
  aside.tall { height: 82vh; }
  .grip { display: block; position: sticky; top: 0; z-index: 3; width: calc(100% + 36px); height: 22px; margin: -4px -18px 2px; border: 0; background: var(--surface); cursor: pointer; }
  .grip::before { content: ""; display: block; width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 7px auto 0; filter: brightness(1.35); }
  .panel-close { top: 22px; }
  .zoombox { bottom: 18px; }
  .globe canvas { height: 150px; }
}
/* landscape phones: keep the side panel, just narrower */
@media (max-height: 500px) and (orientation: landscape) and (min-width: 601px) {
  header { grid-template-columns: auto 1fr minmax(140px, 220px) auto auto; grid-template-areas: "title eras search guide theme"; padding: 6px 12px; }
  header h1 { display: none; }
  .eras { margin: 0; padding: 0 0 0 2px; }
  #overview { height: 59px; }
  aside { width: 300px; padding: 12px 14px 30px; }
  aside h2 { font-size: 17px; }
  .globe canvas { height: 130px; }
}
</style>
</head>
<body>
<header>
  <h1><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16 C9 16 9 7 16 7 S23 16 29 16" fill="none" stroke="hsl(218 70% 55%)" stroke-width="3" stroke-linecap="round"/><path d="M3 16 C9 16 9 25 16 25 S23 16 29 16" fill="none" stroke="hsl(14 75% 55%)" stroke-width="3" stroke-linecap="round"/><path d="M8 16 H24" fill="none" stroke="hsl(168 55% 42%)" stroke-width="3" stroke-linecap="round"/><circle cx="29" cy="16" r="2.6" fill="currentColor"/></svg>Humanitributary <span>· all of history, from the Big Bang to now</span></h1>
  <div class="eras" id="eras"></div>
  <div class="spacer"></div>
  <div class="search">
    <input id="q" type="search" placeholder="Search events & societies  ( / )" autocomplete="off" aria-label="Search">
    <div class="results" id="results"></div>
  </div>
  <button class="btn" id="guideBtn" title="Show or hide the guide (?)" aria-label="Guide"><span class="g-long">Guide</span><span class="g-short">?</span></button>
  <button class="btn" id="themeBtn" title="Toggle light/dark">◐</button>
</header>
<main>
  <div id="stage">
    <canvas id="overview" aria-label="Overview of all time; click to jump"></canvas>
    <div id="canvasWrap">
      <canvas id="tl" tabindex="0" aria-label="Timeline. Arrow keys move between events and branches."></canvas>
      <div id="tip"></div>
      <div class="hint"><kbd>←</kbd><kbd>→</kbd> along a branch · <kbd>↑</kbd><kbd>↓</kbd> switch branch · pinch to zoom · drag to pan · click empty space to close</div>
      <div class="zoombox">
        <button class="btn" id="zin" title="Zoom in (+)">＋</button>
        <button class="btn" id="zout" title="Zoom out (−)">−</button>
        <button class="btn" id="zfit" title="Show all of time (0)">All</button>
      </div>
    </div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>
const DATA = /*__DATA__*/null;
const GLOBE = /*__GLOBE__*/null; // present-day land + PaleoDEM textures (build-globe.mjs); null = no globe
(() => {
"use strict";
// ---------- time scale ----------
// Position = -log10(years-before-now + C). Deep time is compressed; the last centuries get most of the room.
const NOW = (() => { const d = new Date(), y = d.getFullYear(); return y + (d - new Date(y, 0, 1)) / (365.2425 * 864e5); })();
const C = 40;
const sOf = (y) => -Math.log10(Math.max(NOW - y, 0) + C);
const yOf = (s) => NOW - (Math.pow(10, -s) - C);

const REGIONS = [
  { id: "cosmos", name: "Cosmos & Earth", hue: 252 },
  { id: "life", name: "Life", hue: 135 },
  { id: "humans", name: "Human origins", hue: 32 },
  { id: "global", name: "Ideas, technology & global institutions", hue: 195 },
  { id: "faiths", name: "Religions & philosophies", hue: 285 },
  { id: "culture", name: "Arts, culture & sport", hue: 75 },
  { id: "mideast", name: "Middle East, North Africa & Iran", hue: 42 },
  { id: "europe", name: "Europe", hue: 218 },
  { id: "africa", name: "Sub-Saharan Africa", hue: 14 },
  { id: "southasia", name: "South Asia", hue: 328 },
  { id: "eastasia", name: "East, Central & Southeast Asia", hue: 356 },
  { id: "americas", name: "The Americas", hue: 168 },
  { id: "oceania", name: "Oceania", hue: 186 },
];
const REGION = new Map(REGIONS.map((r) => [r.id, r]));

const ERAS = [
  { key: "0", label: "All time", a: -13.8e9, b: NOW },
  { key: "1", label: "Life", a: -4.2e9, b: -2e6 },
  { key: "2", label: "Human origins", a: -7.5e6, b: -3000 },
  { key: "3", label: "Ancient", a: -3600, b: 650 },
  { key: "4", label: "Medieval", a: 450, b: 1550 },
  { key: "5", label: "Early modern", a: 1450, b: 1830 },
  { key: "6", label: "1800–1930", a: 1790, b: 1935 },
  { key: "7", label: "Last 100 years", a: 1920, b: NOW },
  { key: "8", label: "Since 2000", a: 1995, b: NOW },
];

// ---------- data ----------
const branches = DATA.branches.map((b) => ({ ...b, s0: sOf(b.start), s1: sOf(b.end === null ? NOW : b.end), events: [], children: [], succ: [], preds: [] }));
const B = new Map(branches.map((b) => [b.id, b]));
for (const b of branches) {
  for (const p of b.parents) { const pb = B.get(p); if (pb && !pb.children.includes(b)) pb.children.push(b); }
  for (const i of b.into) { const ib = B.get(i); if (ib) { b.succ.push(ib); ib.preds.push(b); } }
}
const all = [];
for (const e of DATA.events) {
  const b = B.get(e.branch); if (!b) continue;
  const ev = { ...e, b, s: sOf(e.y), sEnd: e.end != null ? sOf(e.end) : null, kind: "event" };
  b.events.push(ev); all.push(ev);
}
for (const b of branches) {
  const st = { id: b.id + "--start", b, y: b.start, s: b.s0, when: b.startWhen, title: `Beginning of ${b.name}`, text: b.text, cites: b.cites, imp: 2, kind: "start" };
  b.events.unshift(st); all.push(st);
  if (b.end !== null) {
    const en = { id: b.id + "--end", b, y: b.end, s: b.s1, when: b.endWhen, title: `End of ${b.name}`, text: b.text, cites: b.cites, imp: 2, kind: "end" };
    b.events.push(en); all.push(en);
  }
  const rank = { start: 0, event: 1, end: 2 };
  b.events.sort((p, q) => p.y - q.y || rank[p.kind] - rank[q.kind]);
}
const EV = new Map(all.map((e) => [e.id, e]));
// A connection may point at an event or at a whole branch (then we use the branch's start marker).
const refTarget = (id) => EV.get(id) || (B.get(id) && B.get(id).events[0]) || null;
const connTargets = (x) => (x && x.connections ? x.connections.map((c) => ({ ...c, ev: refTarget(c.id) })).filter((c) => c.ev) : []);
const S_MIN = Math.min(...branches.map((b) => b.s0));
const S_MAX = sOf(NOW);
const FULL = S_MAX - S_MIN;

// ---------- colors ----------
let css = {};
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ["bg", "surface", "fg", "muted", "faint", "line", "grid", "stripe", "axis", "accent", "cursor", "lightness", "sat"]) css[k] = cs.getPropertyValue("--" + k).trim();
  const counts = {};
  for (const b of branches) {
    const r = REGION.get(b.region); const i = (counts[b.region] = (counts[b.region] || 0) + 1);
    const hue = r.hue + (((i * 47) % 44) - 22);
    b.color = `hsl(${hue} ${css.sat} ${css.lightness})`;
    b.colorSoft = `hsl(${hue} ${css.sat} ${css.lightness} / .28)`;
  }
  REGIONS.forEach((r) => (r.color = `hsl(${r.hue} ${css.sat} ${css.lightness})`));
}
readTheme();

// ---------- lanes ----------
// Pack each region's branches into as few lanes as possible; a successor reuses its predecessor's lane so a
// society that changes form (Republic → Empire) reads as one continuous line.
const LANE_H = 46, THIN_H = 17, REGION_H = 24, AXIS_H = 48;
const lanes = [];
const rows = [];
for (const r of REGIONS) {
  const rb = branches.filter((b) => b.region === r.id).sort((p, q) => p.s0 - q.s0);
  if (!rb.length) continue;
  const header = { type: "region", region: r, h: REGION_H, ht: REGION_H, lanes: [] };
  rows.push(header);
  const rl = [];
  for (const b of rb) {
    const preds = [...b.parents.map((p) => B.get(p)), ...b.preds].filter((p) => p && p.lane && p.region === b.region);

<h2>Every stream of history, in one view</h2>
<p>${branches.length} societies, lineages and long-running movements and ${nEvents} events, from the Big Bang to ${new Date().getFullYear()}. Each colored line is a branch; curves show where branches split off, merge or turn into one another, and dashed lines mark moments of contact or blending between two branches.</p>
<p>Time is drawn on a logarithmic scale, so deep time is compressed and the recent past gets the most room; zoom anywhere to spread it out. Under the dates, each gap is labeled with how much time it covers (the same width can be 5 billion years or 5 years), and the <b>true scale</b> strip at the top shows how much of all time you are looking at.</p>
<h3>Getting around</h3>
<div class="keys">
<kbd>← →</kbd><span>Previous / next event on the current branch (continues into a successor or parent branch)</span>
<kbd>↑ ↓</kbd><span>Jump to the nearest branch above / below at the same moment</span>
<kbd>+ −</kbd><span>Zoom in / out around the selection</span>
<kbd>Enter</kbd><span>Zoom in on the selected event</span>
<kbd>0 – 8</kbd><span>Jump to an era (see buttons above)</span>
<kbd>/</kbd><span>Search</span>
<kbd>Esc</kbd><span>Clear the selection and close this panel (or click any empty space)</span>
<kbd>?</kbd><span>Show or hide this guide</span>
</div>
<p class="note" style="margin-top:10px">Trackpad: scroll to move around (up/down through the branches, sideways through time), pinch to zoom. Mouse: wheel moves between branches, Shift+wheel moves through time, Ctrl/⌘+wheel or double-click zooms. Drag to pan; click a dot to read it. Press <b>→</b> to start.</p>
<h3>About the sources</h3>
<p class="note">Every branch and event links to the sources it was written from (${nCites} distinct pages). Each was fetched and read when the entry was written, and the dates and wording follow what the source states; where scholars disagree, the entry says so. Data compiled ${esc(DATA.built)}.</p>
<p class="note">Reading the shapes: a branch's line spans the dates its sources give; markers at either end (□) are its beginning and end. Filled dots are landmark and notable events, hollow dots are finer detail.</p>
</div>`;

// ---------- input ----------
let drag = null;
const pointers = new Map();
cv.addEventListener("pointerdown", (e) => {
  cv.setPointerCapture(e.pointerId); cv.focus({ preventScroll: true });
  pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (pointers.size === 2) { const [p, q] = [...pointers.values()]; drag = { pinch: Math.abs(p.x - q.x) || 1, s0: view.s0, s1: view.s1, cx: (p.x + q.x) / 2 }; setAnchor(drag.cx, (p.y + q.y) / 2); return; }
  drag = { x: e.offsetX, y: e.offsetY, s0: view.s0, s1: view.s1, vy: view.y, moved: false };
});
cv.addEventListener("pointermove", (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (drag && drag.pinch && pointers.size === 2) {
    const [p, q] = [...pointers.values()]; const d = Math.abs(p.x - q.x) || 1;
    const f = drag.pinch / d, s = drag.s0 + (drag.cx / W) * (drag.s1 - drag.s0);
    setView(s - (s - drag.s0) * f, s + (drag.s1 - s) * f, true); return;
  }
  if (drag && !drag.pinch) {
    const dx = e.offsetX - drag.x, dy = e.offsetY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; cv.classList.add("dragging"); }
    if (drag.moved) {
      // the row grabbed stays under the pointer, even as other lanes open and close
      if (!drag.anchor) { setAnchor(drag.x, drag.y, false); drag.anchor = anchor; }
      if (drag.anchor) { anchor = drag.anchor; anchor.y = anchor.y0 ?? (anchor.y0 = anchor.y); anchor.y = anchor.y0 + dy; }
      const ds = (dx / W) * (drag.s1 - drag.s0);
      setView(drag.s0 - ds, drag.s1 - ds, true);
      if (!drag.anchor) view.y = target.y = clampY(drag.vy - dy);
      hideTip(); return;
    }
  }
  updateHover(e.offsetX, e.offsetY);
});
const endPointer = (e) => {
  pointers.delete(e.pointerId);
  if (drag && !drag.pinch && !drag.moved && e.type === "pointerup") {
    const h = hitAt(e.offsetX, e.offsetY);
    if (h) select(h.ev);
    else { const b = branchAt(e.offsetX, e.offsetY); select(b ? nearestOn(b, Sx(e.offsetX)) : null); }
  }
  if (pointers.size === 0) { drag = null; cv.classList.remove("dragging"); }
};
cv.addEventListener("pointerup", endPointer); cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("pointerleave", () => { hover = null; hideTip(); dirty = true; kick(); });
cv.addEventListener("dblclick", (e) => { setAnchor(e.offsetX, e.offsetY); zoomAt(0.45, e.offsetX); });
// Trackpad: two-finger scroll moves around (up/down = lanes, sideways = time), pinch zooms.
// Mouse: wheel = lanes, Shift+wheel = time, Ctrl/⌘/Alt+wheel = zoom.
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
  let dx = e.deltaX * unit, dy = e.deltaY * unit;
  if (e.ctrlKey || e.metaKey || e.altKey) { // pinch arrives as ctrl+wheel
    const now = performance.now();
    if (!anchor || !anchor.zoom || now - anchor.t > 250) { setAnchor(e.offsetX, e.offsetY); if (anchor) anchor.zoom = true; }
    if (anchor) anchor.t = now;
    zoomAt(Math.exp(Math.max(-60, Math.min(60, dy || dx)) * 0.01), e.offsetX, true);
    return;
  }
  if (e.shiftKey && !dx) { dx = dy; dy = 0; }
  if (Math.abs(dx) > 2 * Math.abs(dy)) dy = 0; else if (Math.abs(dy) > 2 * Math.abs(dx)) dx = 0; // axis lock
  if (dy) { anchor = null; view.y = target.y = clampY(view.y + dy); dirty = true; kick(); }
  if (dx) {
    const now = performance.now();
    if (!anchor || anchor.zoom || now - anchor.t > 250) setAnchor(e.offsetX, e.offsetY);
    if (anchor) anchor.t = now;
    const ds = (dx / W) * (view.s1 - view.s0); setView(view.s0 + ds, view.s1 + ds, true);
  }
}, { passive: false });

function hitAt(x, y) { if (y < AXIS_H) return null; let best = null, bd = 10; for (const h of hits) { if (!h.ev) continue; const d = Math.hypot(h.x - x, h.y - y); if (d < bd) { bd = d; best = h; } } return best; }
function branchAt(x, y) {
  if (y < AXIS_H) return null; // rows scrolled up under the date axis are hidden, so not clickable
  for (const L of lanes) { if (L.h < 4 || y < L.top || y > L.top + L.h) continue; const s = Sx(x); return L.branches.find((b) => b.s0 <= s && b.s1 >= s) || null; }
  return null;
}
const tip = document.getElementById("tip");
function updateHover(x, y) {
  const h = hitAt(x, y); const ev = h ? h.ev : null;
  if (ev !== hover) { hover = ev; dirty = true; kick(); }
  if (!ev) return hideTip();
  tip.innerHTML = `<div class="t-when">${esc(ev.when)} · ${esc(ev.b.name)}</div>${esc(ev.title)}`;
  tip.style.display = "block";
  const tx = Math.min(x + 14, W - tip.offsetWidth - 8), ty = y + 16 + tip.offsetHeight > H ? y - tip.offsetHeight - 12 : y + 16;
  tip.style.left = tx + "px"; tip.style.top = ty + "px";
  cv.style.cursor = "pointer";
}
function hideTip() { tip.style.display = "none"; cv.style.cursor = ""; }

// overview click/drag
let ovGrab = null;
const ovS = (e) => { const m = ov._map; return m.s0 + (e.offsetX / m.w) * (m.s1 - m.s0); };
ov.addEventListener("pointerdown", (e) => {
  if (!ov._map || e.offsetY > OV_LOG_H) return;
  try { ov.setPointerCapture(e.pointerId); } catch (_) {}
  const s = ovS(e), sp = target.s1 - target.s0;
  if (s >= target.s0 && s <= target.s1) ovGrab = s - target.s0; // grabbed the box: drag it from where it was held
  else { ovGrab = sp / 2; setAnchor(W / 2, H / 2); setView(s - sp / 2, s + sp / 2); } // clicked elsewhere: glide there
});
ov.addEventListener("pointermove", (e) => {
  if (ovGrab === null || !e.buttons) return;
  if (!anchor) setAnchor(W / 2, H / 2);
  const s = ovS(e), sp = target.s1 - target.s0; setView(s - ovGrab, s - ovGrab + sp, true);
});
const ovEnd = () => (ovGrab = null);
ov.addEventListener("pointerup", ovEnd); ov.addEventListener("pointercancel", ovEnd);

window.addEventListener("keydown", (e) => {
  if (e.target === q) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === "ArrowRight") { e.preventDefault(); step(1); }
  else if (k === "ArrowLeft") { e.preventDefault(); step(-1); }
  else if (k === "ArrowUp") { e.preventDefault(); switchBranch(-1); }
  else if (k === "ArrowDown") { e.preventDefault(); switchBranch(1); }
  else if (k === "+" || k === "=") { setAnchor(W / 2, H / 2); zoomAt(0.6, selected ? X(selected.s) : W / 2); }
  else if (k === "-" || k === "_") { setAnchor(W / 2, H / 2); zoomAt(1 / 0.6, selected ? X(selected.s) : W / 2); }
  else if (k === "Enter" && selected) { const sp = Math.max((target.s1 - target.s0) * 0.35, MIN_SPAN); setView(selected.s - sp / 2, selected.s + sp / 2); }
  else if (k === "Escape") { if (selected) select(null); else setPanel(false); }
  else if (k === "?") { toggleGuide(); }
  else if (k === "/") { e.preventDefault(); q.focus(); q.select(); }
  else { const era = ERAS.find((x) => x.key === k); if (era) showYears(era.a, era.b); }
});

// era buttons, zoom buttons, theme
const erasEl = document.getElementById("eras");
for (const era of ERAS) { const b = document.createElement("button"); b.className = "btn"; b.innerHTML = `${esc(era.label)}<kbd>${era.key}</kbd>`; b.onclick = () => { showYears(era.a, era.b); cv.focus({ preventScroll: true }); }; erasEl.appendChild(b); }
document.getElementById("zin").onclick = () => { setAnchor(W / 2, H / 2); zoomAt(0.6, selected ? X(selected.s) : W / 2); };
document.getElementById("zout").onclick = () => { setAnchor(W / 2, H / 2); zoomAt(1 / 0.6, selected ? X(selected.s) : W / 2); };
document.getElementById("guideBtn").onclick = () => { toggleGuide(); cv.focus({ preventScroll: true }); };
document.getElementById("zfit").onclick = () => showYears(-13.8e9, NOW);
document.getElementById("themeBtn").onclick = () => {
  const root = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = root.dataset.theme || (dark ? "dark" : "light");
  root.dataset.theme = cur === "dark" ? "light" : "dark";
  readTheme(); renderPanel(); density = null; dirty = true; kick();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTheme(); renderPanel(); dirty = true; kick(); });

// search: grouped into branches, periods and events
const q = document.getElementById("q"), res = document.getElementById("results");
let hl = 0, found = [];
const norm = (x) => String(x || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function doSearch() {
  const t = norm(q.value.trim());
  if (!t) { res.classList.remove("open"); found = []; return; }
  const words = t.split(/\s+/);
  // light stemming so "rome" finds "Roman", "egypt" finds "Egyptian", "wars" finds "war"
  const stem = (w) => (w.length > 3 ? w.replace(/(ians|ian|ans|an|es|s|e)$/, "") : w);
  const stems = words.map(stem);
  const has = (hay) => words.every((w) => hay.includes(w));
  const hasStem = (hay) => { const ws = hay.split(/[^a-z0-9]+/); return stems.every((st) => ws.some((w) => w.startsWith(st))); };
  const rank = (name, extra) => { const n = norm(name); return n.startsWith(t) ? 0 : n.includes(t) ? 1 : has(n) ? 2 : hasStem(n) ? 2.5 : has(norm(extra)) ? 4 : hasStem(norm(extra)) ? 5 : 9; };
  const top = (arr, n) => arr.filter((x) => x.r < 9).sort((p, q2) => p.r - q2.r || (p.imp || 2) - (q2.imp || 2) || p.y - q2.y).slice(0, n);
  const groups = [
    ["Branches", top(branches.map((b) => ({ type: "branch", b, y: b.start, r: rank(b.name, b.text) })), 5)],
    ["Periods", top(all.filter((e) => e.kind === "event" && e.sEnd != null).map((e) => ({ type: "period", ev: e, y: e.y, imp: e.imp, r: rank(e.title, e.text + " " + e.b.name) })), 6)],
    ["Events", top(all.filter((e) => e.kind === "event" && e.sEnd == null).map((e) => ({ type: "event", ev: e, y: e.y, imp: e.imp, r: rank(e.title, e.text + " " + e.b.name) })), 8)],
  ];
  found = groups.flatMap(([, g]) => g);
  hl = 0; let i = 0;
  const row = (x) => {
    const k = i++, cls = k === 0 ? "hl" : "";
    if (x.type === "branch") return `<button data-i="${k}" class="${cls}"><span class="r-dot" style="background:${x.b.color}"></span><span class="r-when">${esc(x.b.startWhen)} – ${x.b.end === null ? "present" : esc(x.b.endWhen)} · ${esc(REGION.get(x.b.region).name)}</span><br>${esc(x.b.name)}</button>`;
    return `<button data-i="${k}" class="${cls}"><span class="r-dot" style="background:${x.ev.b.color}"></span><span class="r-when">${esc(x.ev.when)} · ${esc(x.ev.b.name)}</span><br>${esc(x.ev.title)}</button>`;
  };
  res.innerHTML = found.length ? groups.filter(([, g]) => g.length).map(([h, g]) => `<div class="r-head">${h}</div>${g.map(row).join("")}`).join("") : `<div style="padding:10px;color:var(--muted)">No matches</div>`;
  res.classList.add("open");
}
q.addEventListener("input", doSearch);
q.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!found.length) return;
    hl = (hl + (e.key === "ArrowDown" ? 1 : found.length - 1)) % found.length;
    res.querySelectorAll("button[data-i]").forEach((c) => c.classList.toggle("hl", +c.dataset.i === hl));
    res.querySelector(`button[data-i="${hl}"]`)?.scrollIntoView({ block: "nearest" });
  }
  else if (e.key === "Enter" && found[hl]) { pick(found[hl]); }
  else if (e.key === "Escape") { q.value = ""; doSearch(); cv.focus({ preventScroll: true }); }
});
res.addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (b) pick(found[+b.dataset.i]); });
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) res.classList.remove("open"); });
// How much time to show around a single moment. A fixed width on the log scale is proportional to how long ago it
// was: about 50 years around 1975, 600 around 1000 CE, 750,000 around a million years ago.
const CONTEXT_SPAN = 0.22;
function goTo(x) {
  if (x.type === "branch") {
    // the branch's beginning, a little in from the left edge, with as much of the branch as fits
    const sp = Math.min(Math.max(x.b.s1 - x.b.s0, CONTEXT_SPAN), 0.6);
    setView(x.b.s0 - sp * 0.12, x.b.s0 + sp * 0.88);
    select(x.b.events[0]);
  } else if (x.type === "period") {
    const e = x.ev, pad = Math.max((e.sEnd - e.s) * 0.12, 0.004);
    setView(e.s - pad, e.sEnd + pad); select(e);
  } else {
    setView(x.ev.s - CONTEXT_SPAN / 2, x.ev.s + CONTEXT_SPAN / 2); select(x.ev, { center: true });
  }
}
function pick(x) {
  res.classList.remove("open"); q.blur(); cv.focus({ preventScroll: true });
  goTo(x);
}

// ---------- boot ----------
new ResizeObserver(resize).observe(wrap);
window.addEventListener("resize", resize);
resize();
setRowTargets(view.s0, view.s1); rows.forEach((r) => (r.h = r.ht));
// #<event id> opens that event (or period); #<branch id> opens the branch at its start
function openHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && EV.get(id)) { const ev = EV.get(id); goTo(ev.sEnd != null ? { type: "period", ev } : { type: "event", ev }); return true; }
  if (id && B.get(id)) { goTo({ type: "branch", b: B.get(id) }); return true; }
  return false;
}
if (!openHash()) renderPanel();
window.addEventListener("hashchange", openHash);
cv.focus({ preventScroll: true });
})();
</script>
</body>
