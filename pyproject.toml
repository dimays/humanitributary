[project]
name = "humanitributary"
version = "0.1.0"
description = "Humanitributary: an interactive, cited timeline of all history, with Postgres as its source of truth"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=6.0,<7.0",
    "psycopg[binary,pool]>=3.3,<4.0",
    "gunicorn>=23.0,<24.0",
    "whitenoise>=6.9,<7.0",
    "dj-database-url>=2.2,<3.0",
    "python-dotenv>=1.2,<2.0",
    "httpx>=0.28,<1.0",
    "trafilatura>=2.0,<3.0",
    "dateparser>=1.2,<2.0",
    "feedparser>=6.0,<7.0",
    "django-storages[s3]>=1.14,<2.0",
    "boto3>=1.35,<2.0",
    "jsonschema>=4.23,<5.0",
    "markdown>=3.7,<4.0",
    "nh3>=0.2.18,<1.0",
]

[dependency-groups]
dev = [
    "honcho>=2.0,<3.0",
    "tblib>=3.2.2",
]
